[package]
name = "peach-notes"
version = "0.1.0"
edition = "2021"
authors = ["Peach Notes Contributors"]
description = "A native GNOME desktop notes application backed by local Markdown files."

[dependencies]
gtk4 = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libadwaita = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gdk4 = "0.9"
pango = "0.20"
glib = "0.20"
gio = "0.20"
pulldown-cmark = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
regex = "1.10"
log = "0.4"
env_logger = "0.11"
