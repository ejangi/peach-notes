[package]
name = "peach-notes"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-only"
authors = ["Peach Notes Contributors"]
description = "A native GNOME desktop notes application backed by local Markdown files."

[dependencies]
gtk4 = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libadwaita = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gdk4 = "0.9"
pango = "0.20"
glib = "0.20"
gio = "0.20"
pulldown-cmark = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
regex = "1.10"
log = "0.4"
env_logger = "0.11"
sourceview5 = "0.9"

[package.metadata.deb]
maintainer = "Peach Notes Contributors"
copyright = "2026, Peach Notes Contributors"
extended-description = "Peach Notes is a native GNOME desktop notes application built with Rust, GTK4, and Libadwaita."
depends = "$auto, libgtk-4-1, libadwaita-1-0, libgtksourceview-5-0"
section = "utility"
priority = "optional"
assets = [
    ["target/release/peach-notes", "usr/bin/peach-notes", "755"],
    ["assets/org.gnome.PeachNotes.desktop", "usr/share/applications/org.gnome.PeachNotes.desktop", "644"],
    ["assets/icons/peach-notes-icon.png", "usr/share/icons/hicolor/256x256/apps/peach-notes-icon.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/peach-notes", dest = "/usr/bin/peach-notes", mode = "755" },
    { source = "assets/org.gnome.PeachNotes.desktop", dest = "/usr/share/applications/org.gnome.PeachNotes.desktop", mode = "644" },
    { source = "assets/icons/peach-notes-icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/peach-notes-icon.png", mode = "644" },
]
